<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>자원 지킴이 에너지 탐험대 · Energy Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root { 
      font-family: 'Jua', 'Pretendard Variable', Pretendard, system-ui, sans-serif;
      --primary: #10b981;
      --bg: #f8fafc;
    }
    
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      word-break: keep-all; overflow-wrap: break-word;
    }
    
    #stage-wrapper { 
      position: relative; 
      width: 1280px; height: 720px; 
      overflow: hidden;
      background: white;
      box-shadow: 0 40px 100px rgba(0,0,0,0.1);
      border-radius: 20px;
    }

    .bg-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }

    /* Simple Winding Path */
    .map-path {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 4;
      stroke-dasharray: 10 10;
      stroke-linecap: round;
      opacity: 0.5;
    }

    /* Standard Mission Node */
    .mission-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
    }
    .mission-node:hover:not(.locked) { transform: translate(-50%, -55%) scale(1.05); }
    
    .node-icon {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      border: 4px solid #e2e8f0;
    }
    .locked .node-icon { opacity: 0.5; filter: grayscale(1); background: #f1f5f9; }
    .completed .node-icon { border-color: #10b981; }
    .current .node-icon { 
      border-color: #10b981; 
      animation: pulseNode 2s infinite;
    }
    @keyframes pulseNode { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    .node-label {
      margin-top: 10px;
      text-align: center;
      background: white;
      padding: 5px 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      min-width: 140px;
    }

    header {
      background: white;
      border-bottom: 1px solid #f1f5f9;
    }

    .font-outfit { font-family: 'Outfit', sans-serif; }
    .font-title { font-family: 'Jua', sans-serif; }
    .font-cute { font-family: 'Do Hyeon', 'Jua', sans-serif; }
  </style>
</head>
<body>
  <div id="stage-wrapper">
    <div class="bg-gradient"></div>
    
    <svg class="absolute inset-0 w-full h-full" viewBox="0 0 1000 600" style="top: 20px; z-index: 10;">
      <path class="map-path" d="M 180,180 C 300,100 500,100 720,180 T 820,320 T 600,420 T 250,480 T 500,500" />
    </svg>

    <header class="absolute top-0 left-0 right-0 z-50 flex items-center justify-between px-10" style="height: 80px;">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-3xl text-white">🌏</div>
        <div>
          <h1 class="text-2xl font-black text-slate-800 font-title tracking-tight">자원 지킴이 에너지 탐험대</h1>
        </div>
      </div>

      <div class="flex items-center gap-8">
        <div class="flex flex-col items-end">
          <span class="text-[10px] font-black text-slate-400 uppercase font-outfit">Progress</span>
          <div class="flex items-center gap-4">
            <div class="w-40 h-2 bg-slate-100 rounded-full overflow-hidden">
              <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-1000" style="width: 0%;"></div>
            </div>
            <span id="progress-text" class="text-base font-black text-emerald-600 font-outfit">0%</span>
          </div>
        </div>
        <div class="px-4 py-2 bg-slate-50 rounded-xl border border-slate-100 flex items-center gap-3 text-slate-700">
          <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center text-sm">👤</div>
          <span id="student-name" class="font-black text-sm">탐험가</span>
        </div>
      </div>
    </header>

    <div class="absolute top-24 left-1/2 -translate-x-1/2 w-3/4 text-center z-40">
      <div class="inline-flex items-center gap-3 px-6 py-2 bg-white text-slate-700 rounded-full border border-slate-100 font-black text-lg font-cute shadow-sm">
        미션을 하나씩 해결하며 자원 지킴이 에너지 박사가 되어보세요!
      </div>
    </div>

    <main id="map-area" class="absolute inset-0" style="top: 80px;">
      <div id="nodes-layer" class="relative w-full h-full"></div>
    </main>

    <div id="modal" class="absolute inset-0 z-[100] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-10">
      <div class="bg-white max-w-4xl w-full flex overflow-hidden shadow-2xl rounded-2xl" style="height: 500px;">
        <div id="modal-hero" class="w-2/5 flex flex-col items-center justify-center text-center p-12 bg-slate-50 border-r border-slate-100">
          <div id="modal-emoji" class="text-[140px] mb-6">🔥</div>
          <div id="modal-tag" class="px-4 py-1 rounded-full bg-slate-200 text-slate-700 font-black text-xs uppercase">Mission</div>
        </div>
        <div class="w-3/5 p-16 flex flex-col relative">
          <button id="modal-close" class="absolute top-8 right-10 w-12 h-12 flex items-center justify-center text-3xl text-slate-300 hover:text-slate-900 transition">✕</button>
          <h3 id="modal-title" class="text-4xl font-black mb-2 font-title text-slate-900">미션 제목</h3>
          <p id="modal-desc" class="text-xl text-emerald-600 font-bold mb-8 font-cute"></p>
          <div class="flex-1 p-8 rounded-xl bg-slate-50 border border-slate-100 mb-10">
            <p id="modal-body" class="text-xl text-slate-700 leading-relaxed font-cute"></p>
          </div>
          <button id="modal-start" class="w-full py-5 rounded-xl bg-emerald-500 text-white text-2xl font-black shadow-lg hover:bg-emerald-400 transition active:scale-95 font-title">
            미션 시작하기
          </button>
        </div>
      </div>
    </div>

    <div id="select-screen" class="absolute inset-0 z-[200] hidden items-center justify-center" style="background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px);">
      <div class="bg-white p-12 rounded-3xl shadow-2xl max-w-md w-full text-center border-2 border-slate-300">
        <div class="w-24 h-24 bg-emerald-500 rounded-2xl flex items-center justify-center text-5xl text-white mx-auto mb-8 shadow-xl">🌏</div>
        <h2 class="text-3xl font-black text-slate-900 mb-2 font-title">자원 지킴이</h2>
        <p class="text-slate-600 font-bold mb-6">탐험을 시작할 이름을 선택하세요.</p>
        <div id="connect-status" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-bold text-left"></div>
        <select id="student-select" class="w-full p-4 rounded-xl border-2 border-slate-400 bg-white text-slate-900 text-xl font-black mb-6 outline-none focus:border-emerald-500 transition shadow-sm">
          <option value="">이름 선택</option>
        </select>
        <button id="btn-enter" disabled class="w-full py-6 rounded-xl bg-emerald-500 text-white text-2xl font-black shadow-lg disabled:opacity-30 transition active:scale-95 font-title">
          탐험 시작!
        </button>
        <a href="connect_test.html" class="block mt-4 text-xs text-slate-500 hover:text-emerald-600 underline">🔌 연결이 안 될 때 — 진단 도구 열기</a>
      </div>
    </div>

  </div>

  <script>
    const stages = [
      { id: 1, label: '미션 1', emoji: '🔥', title: '에너지를 깨워볼까?', desc: '에너지 찾기 모험', x: 18, y: 28, color: 'bg-orange-50', url: 'lesson1.html', body: '생활 속 숨어있는 에너지를 깨워보세요. 에너지가 없으면 어떤 일이 벌어질까요?' },
      { id: 2, label: '미션 2', emoji: '💎', title: '계속 이용할 수 있는 자원은 무엇일까?', desc: '자원 분류하기', x: 42, y: 20, color: 'bg-emerald-50', url: 'lesson2.html', body: '지구가 주는 선물! 영원히 쓸 수 있는 자원과 아껴야 하는 자원을 분류해볼까요?' },
      { id: 3, label: '미션 3', emoji: '☀️', title: '에너지를 직접 만들자!', desc: '에너지 생산 체험', x: 72, y: 26, color: 'bg-yellow-50', url: 'lesson3.html', body: '햇빛, 바람, 물… 깨끗한 에너지를 직접 생산하는 체험을 시작합니다!' },
      { id: 4, label: '미션 4', emoji: '🌍', title: '우리가 바꾸는 미래', desc: '환경 예측 시뮬레이션', x: 82, y: 52, color: 'bg-emerald-50', url: 'lesson4.html', body: '오늘의 선택이 미래를 결정합니다. 지속 가능한 이용을 위해 올바른 결정을 내려보세요!' },
      { id: 5, label: '미션 5', emoji: '🔍', title: '에너지 도둑을 잡아라!', desc: '에너지 낭비 진단', x: 60, y: 65, color: 'bg-sky-50', url: 'lesson5.html', body: '집 안 구석구석 숨어있는 에너지 도둑을 찾아내 진단하고 해결하세요!' },
      { id: 6, label: '미션 6', emoji: '🏠', title: '에코 하우스의 비밀', desc: '첨단 에너지 효율 기술', x: 25, y: 72, color: 'bg-indigo-50', url: 'lesson6.html', body: '에너지 효율이 극대화된 에코 하우스의 첨단 기술들을 직접 탐험해보세요!' },
      { id: 7, label: '미션 7', emoji: '🏘️', title: '내가 만드는 에너지 마을', desc: '작품 발표 & 친구 평가', x: 50, y: 78, color: 'bg-pink-50', url: 'lesson7.html', body: '나만의 에너지 마을을 그려서 올리고, 친구들의 작품을 함께 보며 평가해 봅시다!' }
    ];

    const STORAGE_KEY = 'energy-explorer-v1';
    let state = { completed: [] };
    function loadState() {
      try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"completed":[]}'); } catch { state = { completed: [] }; }
    }

    function renderMap() {
      const layer = document.getElementById('nodes-layer');
      layer.innerHTML = '';
      stages.forEach((s) => {
        const isCompleted = state.completed.includes(s.id);
        const isUnlocked = s.id === 1 || state.completed.includes(s.id - 1);
        const isCurrent = isUnlocked && !isCompleted;
        const node = document.createElement('div');
        node.className = `mission-node ${!isUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}`;
        node.style.left = s.x + '%';
        node.style.top = s.y + '%';
        node.innerHTML = `
          <div class="node-icon"><span>${isUnlocked ? s.emoji : '🔒'}</span></div>
          <div class="node-label">
            <div class="text-[9px] font-black text-emerald-600 uppercase mb-0.5">${s.label}</div>
            <div class="text-sm font-black text-slate-800 font-title leading-tight">${s.title}</div>
          </div>
        `;
        if (isUnlocked) node.onclick = () => openModal(s);
        layer.appendChild(node);
      });
      const pct = Math.round((state.completed.length / stages.length) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = pct + '%';
    }

    let activeStage = null;
    function openModal(s) {
      activeStage = s;
      document.getElementById('modal-emoji').textContent = s.emoji;
      document.getElementById('modal-tag').textContent = s.label;
      document.getElementById('modal-title').textContent = s.title;
      document.getElementById('modal-desc').textContent = s.desc;
      document.getElementById('modal-body').textContent = s.body;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }
    document.getElementById('modal-close').onclick = () => document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal-start').onclick = () => { location.href = activeStage.url; };

    async function loadStudents() {
      const select = document.getElementById('student-select');
      const status = document.getElementById('connect-status');
      function showStatus(html, kind) {
        status.classList.remove('hidden');
        status.className = 'mb-4 px-4 py-3 rounded-xl text-sm font-bold text-left ' +
          (kind === 'ok'   ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
           kind === 'warn' ? 'bg-amber-50  text-amber-800  border border-amber-200'  :
                             'bg-rose-50   text-rose-800   border border-rose-200');
        status.innerHTML = html;
      }
      if (!appHelpers.hasApi()) {
        showStatus('⚠ 스프레드시트가 연결되어 있지 않아요. <a href="connect_test.html" class="underline">진단 도구</a>에서 설정 확인이 필요해요.', 'warn');
        return;
      }
      try {
        const res = await appHelpers.apiGet('students');
        if (res && res.ok && Array.isArray(res.students)) {
          if (res.students.length === 0) {
            showStatus('⚠ 연결은 되었지만 "학생명단" 시트가 비어 있어요. (A=번호, B=이름)', 'warn');
          } else {
            select.innerHTML = '<option value="">이름 선택</option>' + res.students.map(n => `<option value="${n}">${n}</option>`).join('');
            showStatus('✓ 스프레드시트 연결 정상 · 학생 ' + res.students.length + '명', 'ok');
          }
        } else {
          showStatus('❌ 서버 응답 오류: ' + (res && res.error ? res.error : '알 수 없음') + ' &nbsp; <a href="connect_test.html" class="underline">진단 도구 열기</a>', 'fail');
        }
      } catch (e) {
        showStatus('❌ 연결 실패: ' + (e.message || e) + '<br>가능한 원인: API_URL 오타, Apps Script 미배포, 액세스 권한 부족.<br><a href="connect_test.html" class="underline">진단 도구 열기 →</a>', 'fail');
      }
    }

    document.getElementById('student-select').onchange = (e) => { document.getElementById('btn-enter').disabled = !e.target.value; };
    document.getElementById('btn-enter').onclick = () => {
      const name = document.getElementById('student-select').value;
      appHelpers.setStudent(name);
      document.getElementById('student-name').textContent = name;
      document.getElementById('select-screen').classList.add('hidden');
      renderMap();
    };

    function fitStage() {
      const stage = document.getElementById('stage-wrapper');
      const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    window.onload = () => { fitStage(); loadState(); const currentStudent = appHelpers.getStudent(); if (!currentStudent) { document.getElementById('select-screen').classList.remove('hidden'); document.getElementById('select-screen').classList.add('flex'); loadStudents(); } else { document.getElementById('student-name').textContent = currentStudent; renderMap(); } };
  </script>
</body>
</html>
